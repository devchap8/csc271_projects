<!--
Devin Chapman
This page is the card study screen, where people will open a deck of flashcards
that they imported and study them. The user will click one of the 4 buttons at
the bottom based on how comfortable they feel with the word, and the card will
appear again after the designated amount of time. When fully implemented, when
first opening the page only the top half of the page will be shown. When the
user thinks they know the definition, they press a button to show the back side,
with the reading of the word, the definition, the reading of the sentence, and
the sentence translated. The reading of the sentence and sentence translation
appears in the top half on this screen, but will not be shown before the 
definition is shown. 
 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Cards | Cardwell</title>

    <meta name="description" content="Review your CardWell flashcards with a new example sentence for each word, then rate how well you knew it to schedule the next review.">
    <meta name="robots" content="noindex">
    <!-- noindex because this page is only reachable after logging in -->

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CardWell">
    <meta property="og:title" content="Study Cards | CardWell">
    <meta property="og:description" content="Review your CardWell flashcards with a new example sentence for each word, then rate how well you knew it to schedule the next review.">
    <meta property="og:url" content="https://devchap8.rhody.dev/csc271_projects/product_site/studyScreen.html">
    <meta property="og:image" content="https://devchap8.rhody.dev/csc271_projects/product_site/images/cardwell_logo.png">
    <meta property="og:image:alt" content="CardWell logo">

    <link rel="stylesheet" href="css/studyScreen.css">
    <script src="./js/studyScreen.js" type="module" defer></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3Q2FC805Z7"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-3Q2FC805Z7');
    </script>
</head>
<body>
    <header>
        <a href="./index.html"><img src="images/cardwell_logo.png" alt="CardWell logo" height="40"></a>
        <div class="nav-links">
            <!-- Change these links later when pages are made -->
            <a class="nav-link" href="./signup.html">Home</a>
            <a class="nav-link" href="./signup.html">Decks</a>
            <a class="nav-link" href="./signup.html">Add</a>
            <a class="nav-link" href="./signup.html">Browse</a>
        </div>
        <span class="card-count">Card <span class="numCards">1</span>/<span class="totalCards">100</span></span>
    </header>

    <hr>

    <main>
        <div class="main-top">
            <div class="sentence-count">Sentence <span class="sentence-number">4</span> of <span class="sentence-total">10</span> for this word</div>
            <h1 class="word">時計</h1>
            <p class="sentence">この時計は十分遅れています</p>
            <p class="sentence-reading">このとけいはじゅっぷんおくれています</p>
            <p class="sentence-translation">This clock is ten minutes slow.</p>
        </div>

        <hr>

        <div class="main-bottom">
            <img class="card-image" src="images/watch.jpg" alt="wristwatch">
            <h2 class="word-reading">とけい</h2>
            <div class="definition">clock; watch; timepiece</div>
            <a class="more-sentences" href="./signup.html">See other example sentences for "時計" -></a>
        </div>

        <div class="answer-button-container">
            <div class="answer">
                <div class="answer-interval">10m</div>
                <button class="answer-button" id="again">Again</button>
            </div>
            <div class="answer">
                <div class="answer-interval">2mo</div>
                <button class="answer-button" id="hard">Hard</button>
            </div>
            <div class="answer">
                <div class="answer-interval">3.5mo</div>
                <button class="answer-button" id="good">Good</button>
            </div>
            <div class="answer">
                <div class="answer-interval">5mo</div>
                <button class="answer-button" id="easy">Easy</button>
            </div>
        </div>

    </main>

    <div class="done-message-container hidden">
        <div class="done-top">Congratulations!</div>
        <div class="done-mid">You have studied all cards in this deck today.</div>
        <div><a href="/">Return Home</a></div>
    </div>

    <hr>

    <footer>
        <button class="footer-button">Edit Card</button>
        <button class="footer-button">Report Card</button>
    </footer>
</body>
</html>
