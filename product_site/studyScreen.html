<!--
Devin Chapman
This page is the card study screen, where people will open a deck of flashcards
that they imported and study them. The user will click one of the 4 buttons at
the bottom based on how comfortable they feel with the word, and the card will
appear again after the designated amount of time. When fully implemented, when
first opening the page only the top half of the page will be shown. When the
user thinks they know the definition, they press a button to show the back side,
with the reading of the word, the definition, the reaing of the sentence, and
the sentence translated. The reading of the sentence appears in the top half on
this screen, but will not be shown before the definition is shown. 
 -->

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Cards</title>
</head>
<body>
    <header>
        <a href="./signup.html">Home</a>
        <a href="./signup.html">Decks</a>
        <a href="./signup.html">Add</a>
        <a href="./signup.html">Browse</a>
        <span>Card 11/120</p>
    </header>
    <hr>
    <main>
        <div>
            <div>Sentence 4 of 9 for this word</div>
            <h1>時計</h1>
            <p>この時計は十分遅れています</p>
            <p>このとけいはじゅっぷんおくれています</p>
        </div>
        <hr>
        <h3>とけい</h3>
        <div>clock; watch; timepiece</div>
        <p>This clock is ten minutes slow.</p>
        <a href="./signup.html">See other example sentences for "時計" -></a>
        
        <br>
        <br>

        <div>
            <div>10m</div>
            <button>Again</button>
        </div>
        <div>
            <div>2mo</div>
            <button>Hard</button>
        </div>
        <div>
            <div>3.5mo</div>
            <button>Good</button>
        </div>
        <div>
            <div>5mo</div>
            <button>Easy</button>
        </div>

    </main>

    <hr>

    <footer>
        <button>Edit Card</button>
    </footer>
</body>
</html>
