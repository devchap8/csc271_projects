<!--
Devin Chapman
This page is the card study screen, where people will open a deck of flashcards
that they imported and study them. The user will click one of the 4 buttons at
the bottom based on how comfortable they feel with the word, and the card will
appear again after the designated amount of time. When fully implemented, when
first opening the page only the top half of the page will be shown. When the
user thinks they know the definition, they press a button to show the back side,
with the reading of the word, the definition, the reading of the sentence, and
the sentence translated. The reading of the sentence and sentence translation
appears in the top half on this screen, but will not be shown before the 
definition is shown. 
 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Cards</title>
    <link rel="stylesheet" href="css/studyScreen.css">
</head>
<body>
    <header>
        <a href="./signup.html"><img src="images/cardwell_logo.png" alt="CardWell logo" height="30px"></a>
        <div>
            <a href="./signup.html">Home</a>
            <a href="./signup.html">Decks</a>
            <a href="./signup.html">Add</a>
            <a href="./signup.html">Browse</a>
        </div>
        <span>Card 11/120</span>
    </header>

    <hr>

    <main>
        <div class="main-top">
            <div>Sentence 4 of 9 for this word</div>
            <h1>時計</h1>
            <p>この時計は十分遅れています</p>
            <p>このとけいはじゅっぷんおくれています</p>
            <p>This clock is ten minutes slow.</p>
        </div>

        <hr>

        <div class="main-bottom">
            <img src="images/watch.jpg" alt="wristwatch">
            <h3>とけい</h3>
            <div>clock; watch; timepiece</div>
            <a href="./signup.html">See other example sentences for "時計" -></a>
        </div>

        <div class="answer-button-container">
            <div>
                <div>10m</div>
                <button id="again">Again</button>
            </div>
            <div>
                <div>2mo</div>
                <button id="hard">Hard</button>
            </div>
            <div>
                <div>3.5mo</div>
                <button id="good">Good</button>
            </div>
            <div>
                <div>5mo</div>
                <button id="easy">Easy</button>
            </div>
        </div>

    </main>

    <hr>

    <footer>
        <button>Edit Card</button>
        <button>Report Card</button>
    </footer>
</body>
</html>
<!-- 
この時計は十分遅れています
.
このとけいはじゅっぷんおくれています
.
This clock is ten minutes slow. -->
